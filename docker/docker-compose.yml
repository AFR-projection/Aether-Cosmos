services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_DISABLED=false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/auth/csrf').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_DISABLED=false
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  subtitle-control:
    <<: &subtitle-worker
      build:
        context: ..
        dockerfile: docker/Dockerfile.worker
      env_file:
        - ../.env
      environment:
        - NODE_ENV=production
        - REDIS_URL=redis://redis:6379
        - REDIS_DISABLED=false
      depends_on:
        redis:
          condition: service_healthy
        app:
          condition: service_healthy
      restart: unless-stopped
    command: ["tsx", "workers/subtitles/control.ts"]

  subtitle-prepare:
    <<: *subtitle-worker
    command: ["tsx", "workers/subtitles/prepare.ts"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_DISABLED=false
      - SUBTITLE_PREPARE_CONCURRENCY=${SUBTITLE_PREPARE_CONCURRENCY:-1}
    tmpfs:
      - /tmp:size=${SUBTITLE_PREPARE_SCRATCH_SIZE:-2g},mode=1777
    deploy:
      resources:
        limits:
          cpus: "${SUBTITLE_PREPARE_CPUS:-2.0}"
          memory: ${SUBTITLE_PREPARE_MEMORY:-2G}

  subtitle-asr:
    <<: *subtitle-worker
    command: ["tsx", "workers/subtitles/asr.ts"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_DISABLED=false
      - SUBTITLE_ASR_CONCURRENCY=${SUBTITLE_ASR_CONCURRENCY:-1}
      - SUBTITLE_OPENAI_FALLBACK_URL=${SUBTITLE_OPENAI_FALLBACK_URL:-}
      - SUBTITLE_LOCAL_PROVIDER_HOSTS=${SUBTITLE_LOCAL_PROVIDER_HOSTS:-}

  subtitle-translate:
    <<: *subtitle-worker
    command: ["tsx", "workers/subtitles/translate.ts"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_DISABLED=false
      - SUBTITLE_TRANSLATE_CONCURRENCY=${SUBTITLE_TRANSLATE_CONCURRENCY:-2}
      - SUBTITLE_OPENAI_FALLBACK_URL=${SUBTITLE_OPENAI_FALLBACK_URL:-}
      - SUBTITLE_LOCAL_PROVIDER_HOSTS=${SUBTITLE_LOCAL_PROVIDER_HOSTS:-}

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./generated/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  setup:
    profiles: ["setup"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.setup
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
    restart: "no"

volumes:
  redis_data:
